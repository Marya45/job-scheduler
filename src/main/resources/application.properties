spring.application.name=job-scheduler

spring.security.user.name=rohan
spring.security.user.password=marya

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/job-scheduler}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:1507}

spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

logging.level.org.springframework.security=TRACE

jwt.secret=${JWT_SECRET:ThisIsMyVeryLongSecretKeyForDevelopment123456789}
jwt.expiration=${JWT_EXPIRATION:3600000}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

spring.rabbitmq.listener.simple.acknowledge-mode=auto
spring.rabbitmq.listener.simple.default-requeue-rejected=false

app.worker.enabled=${WORKER_ENABLED:true}
app.scheduler.enabled=${SCHEDULER_ENABLED:true}